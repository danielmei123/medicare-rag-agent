name: DAST

# Dynamic application security testing: ZAP crawls the running
# application rather than reading the source, so it catches things
# static analysis cannot - missing security headers, information
# disclosure, cookie handling.
#
# Scheduled and manual rather than on every push: the scan takes a few
# minutes and the deployed endpoint changes less often than the code.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  zap:
    name: ZAP baseline scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: ghcr.io/zaproxy/zaproxy:stable
          # Scanning the EKS endpoint rather than Lambda: the Lambda
          # account concurrency limit is low enough that a crawl can
          # trigger throttling.
          target: http://a337b3cb30b9d49d09a15db98f75826f-748281857.us-east-1.elb.amazonaws.com
          rules_file_name: .zap/rules.tsv
          cmd_options: -a
          allow_issue_writing: true
          issue_title: "DAST: ZAP baseline findings"
          fail_action: false